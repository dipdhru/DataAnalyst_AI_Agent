name: CI

on:
  push:
  workflow_dispatch:

env:
  UV_PYTHON: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format
        run: uv run --frozen ruff format --check .
      # Tests needing the 230 MB Olist dataset skip here; run them locally (see README).
      - name: Test
        run: uv run --frozen pytest -q
