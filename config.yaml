# DataAnalyst Agent configuration. Secrets go in .env, never here.
# Relative paths resolve against this file's directory.

state_dir: state            # app.db (catalog, later memory) and uploads.duckdb live here

query:
  default_row_limit: 1000   # rows returned when the caller gives no limit
  max_row_limit: 10000      # hard cap, whatever the caller asks for
  timeout_seconds: 30

profiling:
  sample_values: 5          # distinct example values stored per column
  max_rows: 1000000         # larger tables are profiled on their first N rows
  timeout_seconds: 120

uploads:
  name: uploads             # source name for uploaded CSV/Excel tables
  max_upload_mb: 200

sources:
  - name: olist
    type: sqlite
    path: data/olist/olist.sqlite

  # - name: warehouse
  #   type: postgres
  #   url_env: ANALYST_PG_URL   # read-only user
  #   schemas: [public]
