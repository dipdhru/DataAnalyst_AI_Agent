# DataAnalyst Agent configuration. Secrets go in .env, never here.
# Relative paths resolve against this file's directory.

state_dir: state            # app.db (catalog, later memory) lives here

query:
  default_row_limit: 1000   # rows returned when the caller gives no limit
  max_row_limit: 10000      # hard cap, whatever the caller asks for
  timeout_seconds: 30

profiling:
  sample_values: 5          # distinct example values stored per column
  max_rows: 1000000         # larger tables are profiled on their first N rows
  timeout_seconds: 120

agent:
  # Free for now: Gemini's free tier through its OpenAI-compatible API (key: GEMINI_API_KEY in
  # .env). For Claude, set provider: anthropic and model: claude-opus-5-5 (needs API credits).
  provider: openai_compatible
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  api_key_env: GEMINI_API_KEY
  model: gemini-3.6-flash   # free tier: 20 requests/day per model (checked 2026-11-02)
  min_seconds_between_calls: 5  # free tier allows roughly 10-15 requests a minute
  effort: high              # Claude only: low | medium | high | xhigh | max
  max_steps: 15             # model turns per question before giving up
  result_rows_shown: 50     # rows of each query result the model sees

metrics_path: metrics.yaml  # business definitions per source (semantic layer)

sources:
  - name: olist
    type: sqlite
    path: data/olist/olist.sqlite

  # - name: warehouse
  #   type: postgres
  #   url_env: ANALYST_PG_URL   # read-only user
  #   schemas: [public]
