- id: mkt_lead_conversion
  category: marketing
  difficulty: medium
  status: draft
  question: What is our lead-to-seller conversion rate?
  uses:
  - lead_conversion
  sql: |
    SELECT (SELECT COUNT(*) FROM leads_qualified) AS qualified_leads,
           (SELECT COUNT(*) FROM leads_closed) AS closed_deals,
           ROUND(100.0 * (SELECT COUNT(*) FROM leads_closed)
                 / (SELECT COUNT(*) FROM leads_qualified), 2) AS conversion_pct
  expected:
    columns:
    - qualified_leads
    - closed_deals
    - conversion_pct
    rows:
    - - 8000
      - 842
      - 10.53
- id: mkt_top_origin
  category: marketing
  difficulty: medium
  status: draft
  question: Which marketing channel brings in the most closed deals?
  sql: |
    SELECT COALESCE(q.origin, 'unknown') AS origin, COUNT(*) AS closed_deals
    FROM leads_closed c
    JOIN leads_qualified q ON q.mql_id = c.mql_id
    GROUP BY 1
    ORDER BY closed_deals DESC
    LIMIT 1
  expected:
    columns:
    - origin
    - closed_deals
    rows:
    - - organic_search
