  difficulty: medium
  status: draft
  question: How is payment value split across payment methods?
  sql: |
    SELECT payment_type,
           ROUND(SUM(payment_value), 2) AS payment_value,
           ROUND(100.0 * SUM(payment_value) / (SELECT SUM(payment_value) FROM order_payments), 1)
             AS share_pct
    FROM order_payments
    GROUP BY 1
    ORDER BY payment_value DESC
