- id: rvw_late_vs_on_time
  category: reviews
  difficulty: hard
  status: draft
  question: Do late deliveries get worse reviews than on-time ones?
  uses:
  - delivered_order
  - late_delivery
  sql: |
    SELECT CASE WHEN date(o.order_delivered_customer_date)
                     > date(o.order_estimated_delivery_date)
                THEN 'late' ELSE 'on_time' END AS delivery,
           COUNT(*) AS reviews,
           ROUND(AVG(r.review_score), 2) AS avg_review_score
    FROM order_reviews r
    JOIN orders o ON o.order_id = r.order_id
    WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
    GROUP BY 1
    ORDER BY 1
  expected:
    columns:
    - delivery
    - reviews
    - avg_review_score
    rows:
    - - late
      - 6409
      - 2.27
    - - on_time
      - 89944
      - 4.29
- id: rvw_worst_category
  category: reviews
  difficulty: hard
  status: draft
  question: Which product category has the lowest average review score (at least 500 reviews)?
  uses:
  - category
  pitfalls: Joining reviews straight to order_items counts a review once per item. Here each review counts
    once per category in its order.
  sql: |
    WITH order_categories AS (
      SELECT DISTINCT oi.order_id,
             COALESCE(t.product_category_name_english, p.product_category_name, 'unknown')
               AS category
      FROM order_items oi
      LEFT JOIN products p ON p.product_id = oi.product_id
      LEFT JOIN product_category_name_translation t
        ON t.product_category_name = p.product_category_name
    )
    SELECT oc.category, COUNT(*) AS reviews, ROUND(AVG(r.review_score), 2) AS avg_review_score
    FROM order_reviews r
    JOIN order_categories oc ON oc.order_id = r.order_id
    GROUP BY 1
    HAVING COUNT(*) >= 500
    ORDER BY avg_review_score
    LIMIT 1
  expected:
    columns:
    - category
    - reviews
    - avg_review_score
    rows:
    - - office_furniture
      - 1268
      - 3.62
- id: pay_type_share
