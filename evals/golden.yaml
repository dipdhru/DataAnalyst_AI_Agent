about: Golden question set for the Olist test data. Every agent change is scored against it (phase 2).
  Each question starts as status 'draft'. Review the question, the SQL and the expected answer, then set
  status to 'approved' (or fix the SQL, or the definition it relies on). Only approved questions count
  in the eval. Expected answers are computed by scripts/build_golden.py from the SQL; never edit them
  by hand.
dataset: olist
source: olist
definitions_status: approved  # approved by the user on 2026-11-02
definitions:
  valid_order: An order whose order_status is not 'canceled' or 'unavailable'. Revenue, AOV, repeat customers
    and seller metrics only count valid orders.
  revenue: SUM(order_items.price) over valid orders. Excludes freight_value. Not payment_value, which
    also includes freight, installment interest and vouchers.
  order_date: orders.order_purchase_timestamp. Months are calendar months of that timestamp.
  aov: Average order value = revenue / number of distinct valid orders that have items.
  delivered_order: order_status = 'delivered' and order_delivered_customer_date is not null (8 delivered
    orders have no delivery date and are left out).
  late_delivery: A delivered order whose delivery date (day) is after order_estimated_delivery_date (day).
    Delivered on the estimated day counts as on time. Late rate = late / delivered orders.
  delivery_days: julianday(order_delivered_customer_date) - julianday(order_purchase_timestamp).
  customer: A person, identified by customers.customer_unique_id. customers.customer_id is per order,
    so counting it would count orders, not people.
  repeat_customer: A customer with 2 or more distinct valid orders.
  category: English name from product_category_name_translation; falls back to the Portuguese name (2
    categories have no translation), then 'unknown' (610 products have no category).
  active_seller: A seller with at least one item in a valid order.
  lead_conversion: Closed deals (leads_closed) / marketing-qualified leads (leads_qualified).
data_notes:
- Orders run from 2016-09 to 2018-10. 2016 and 2018-09/10 have very few orders, so full-year comparisons
  use 2017 and same-period comparisons use January to August.
- 775 orders have no items (mostly unavailable/canceled); they contribute no revenue.
- 547 orders have more than one review; review averages are per review, not per order.
questions:
- id: rev_total
  category: revenue
  difficulty: easy
  status: draft
  question: What is our total revenue?
  uses:
  - revenue
  - valid_order
  pitfalls: Using payment_value, or adding freight, or including canceled orders.
  sql: |
    SELECT ROUND(SUM(oi.price), 2) AS revenue
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
  expected:
    columns:
    - revenue
    rows:
    - - 13494400.74
- id: rev_top_categories
  category: revenue
  difficulty: medium
  status: draft
  question: What are the top 5 product categories by revenue?
  uses:
  - revenue
  - category
  pitfalls: Showing Portuguese names; dropping products whose category has no translation.
  sql: |
    SELECT COALESCE(t.product_category_name_english, p.product_category_name, 'unknown')
             AS category,
           ROUND(SUM(oi.price), 2) AS revenue
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    LEFT JOIN products p ON p.product_id = oi.product_id
    LEFT JOIN product_category_name_translation t
      ON t.product_category_name = p.product_category_name
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
    GROUP BY 1
    ORDER BY revenue DESC
    LIMIT 5
  expected:
    columns:
    - category
    - revenue
    rows:
    - - health_beauty
      - 1255695.13
    - - watches_gifts
      - 1198185.21
    - - bed_bath_table
      - 1035964.06
    - - sports_leisure
      - 979740.92
    - - computers_accessories
      - 904322.02
