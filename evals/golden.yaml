- id: cus_repeat_share
  category: customers
  difficulty: hard
  status: draft
  question: What share of customers have ordered more than once?
  uses:
  - customer
  - repeat_customer
  - valid_order
  pitfalls: Using customer_id, which makes almost nobody a repeat customer.
  sql: |
    WITH per_customer AS (
      SELECT c.customer_unique_id, COUNT(DISTINCT o.order_id) AS orders
      FROM orders o
      JOIN customers c ON c.customer_id = o.customer_id
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
      GROUP BY 1
    )
    SELECT COUNT(*) AS customers,
           SUM(orders >= 2) AS repeat_customers,
           ROUND(100.0 * SUM(orders >= 2) / COUNT(*), 2) AS repeat_pct
    FROM per_customer
  expected:
    columns:
    - customers
    - repeat_customers
    - repeat_pct
    rows:
    - - 94990
      - 2888
      - 3.04
