  uses:
  - delivered_order
  - delivery_days
  sql: |
    SELECT ROUND(AVG(julianday(order_delivered_customer_date)
                     - julianday(order_purchase_timestamp)), 1) AS avg_delivery_days
    FROM orders
    WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
  expected:
    columns:
    - avg_delivery_days
    rows:
    - - 12.6
- id: del_fastest_state
  category: delivery
  difficulty: medium
  status: draft
  question: Which state gets the fastest deliveries (states with at least 500 delivered orders)?
  uses:
