- id: rev_aov
  category: revenue
  difficulty: easy
  status: draft
  question: What is our average order value?
  uses:
  - aov
  - revenue
  - valid_order
  pitfalls: Averaging item prices instead of order totals.
  sql: |
    SELECT ROUND(SUM(oi.price) / COUNT(DISTINCT o.order_id), 2) AS aov
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
  expected:
    columns:
    - aov
    rows:
    - - 137.42
- id: rev_growth_2018
  category: revenue
  difficulty: hard
  status: draft
  question: How did revenue in January to August 2018 compare with the same period of 2017?
  uses:
  - revenue
  - order_date
  pitfalls: Comparing full years (2018 data stops in October and is sparse after August).
  sql: |
    WITH r AS (
      SELECT SUM(CASE WHEN o.order_purchase_timestamp >= '2017-01-01'
                       AND o.order_purchase_timestamp < '2017-09-01' THEN oi.price END) AS r17,
             SUM(CASE WHEN o.order_purchase_timestamp >= '2018-01-01'
                       AND o.order_purchase_timestamp < '2018-09-01' THEN oi.price END) AS r18
      FROM order_items oi
      JOIN orders o ON o.order_id = oi.order_id
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
    )
    SELECT ROUND(r17, 2) AS revenue_2017_jan_aug,
           ROUND(r18, 2) AS revenue_2018_jan_aug,
           ROUND(100.0 * (r18 / r17 - 1), 1) AS growth_pct
    FROM r
  expected:
    columns:
    - revenue_2017_jan_aug
    - revenue_2018_jan_aug
    - growth_pct
    rows:
    - - 3080850.81
      - 7341037.41
      - 138.3
- id: rev_freight_share
  category: revenue
  difficulty: easy
  status: draft
  question: How much do customers pay in freight, as a percentage of item revenue?
  uses:
  - revenue
  - valid_order
  sql: |
    SELECT ROUND(100.0 * SUM(oi.freight_value) / SUM(oi.price), 1) AS freight_pct_of_revenue
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
  expected:
    columns:
    - freight_pct_of_revenue
    rows:
    - - 16.6
