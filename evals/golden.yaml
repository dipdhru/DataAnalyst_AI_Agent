- id: del_late_rate
  category: delivery
  difficulty: medium
  status: draft
  question: What is our late-delivery rate?
  uses:
  - delivered_order
  - late_delivery
  pitfalls: Comparing timestamps instead of days; including undelivered orders.
  sql: |
    SELECT ROUND(100.0 * SUM(date(order_delivered_customer_date)
                             > date(order_estimated_delivery_date)) / COUNT(*), 2)
             AS late_pct
    FROM orders
    WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
  expected:
    columns:
    - late_pct
    rows:
    - - 6.77
- id: del_late_by_state
  category: delivery
  difficulty: hard
  status: draft
  question: Which 5 states have the worst late-delivery rate (states with at least 500 delivered orders)?
  uses:
  - delivered_order
  - late_delivery
  sql: |
    SELECT c.customer_state AS state,
           COUNT(*) AS delivered_orders,
           ROUND(100.0 * SUM(date(o.order_delivered_customer_date)
                             > date(o.order_estimated_delivery_date)) / COUNT(*), 2)
             AS late_pct
    FROM orders o
    JOIN customers c ON c.customer_id = o.customer_id
    WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
    GROUP BY 1
    HAVING COUNT(*) >= 500
    ORDER BY late_pct DESC
    LIMIT 5
  expected:
    columns:
    - state
    - delivered_orders
    - late_pct
    rows:
    - - MA
      - 717
      - 17.43
    - - CE
      - 1279
      - 13.76
    - - BA
      - 3256
      - 12.16
    - - RJ
      - 12350
      - 12.11
    - - PA
      - 946
      - 11.21
- id: del_avg_days
  category: delivery
  difficulty: medium
  status: draft
