[project]
name = "dataanalyst-agent"
version = "0.1.0"
description = "Plug-and-play data analyst chatbot: connect a SQL database, ask questions, get SQL, tables and charts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "sqlglot>=25.0",
    "pandas>=2.2",
    "anthropic>=1.0",
    "openai>=1.40",
    "streamlit>=1.66.1",
    "plotly>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "jupyterlab>=4.6.5",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "full_olist: runs against the full Olist dataset in data/olist (slower)",
    "bird: runs against BIRD Mini-Dev in data/bird (run scripts/setup_bird.py first)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
